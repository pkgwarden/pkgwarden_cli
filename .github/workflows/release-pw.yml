name: Release pw

# Dispatch-only on purpose (same rule as the companion's release workflow): the monorepo
# mirror pushes the pw-v* tag on snapshot runs too, and a tag-push trigger would both
# publish those and race the mirror's own dispatch into two concurrent releases of one tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (example: pw-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

# Never cancel a publish in flight, and never run two for the same tag: a half-finished
# release leaves partial assets that the retry then collides with.
concurrency:
  group: release-pw-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: macos-latest
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Build PyApp (gate)
        run: |
          set -euo pipefail
          chmod +x install/build_pyapp.sh
          install/build_pyapp.sh gate "pw-${{ matrix.triple }}"
          test -f "pw-${{ matrix.triple }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pw-${{ matrix.triple }}
          path: pw-${{ matrix.triple }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pw-*
          merge-multiple: true

      - name: Assemble release files
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p upload
          mv artifacts/pw-* upload/
          (cd upload && sha256sum pw-* > SHA256SUMS)
          cp install/install.sh upload/install.sh
          sed -i "s/__PW_RELEASE_TAG__/${TAG}/g" upload/install.sh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: upload/*
