[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkgwarden-cli"
version = "0.2.1"
description = "Command-line client for pkgwarden airgapped API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.408",
]

[project.scripts]
pw = "pkgwarden_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgwarden_cli"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
